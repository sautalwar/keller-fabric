# Fabric Fan-Out Deployment
# Deploys from Dev workspace to multiple regional QA/Prod workspaces in parallel.
# Generated by GitHub Copilot Agent Mode

name: Fabric Fan-Out Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_stage:
        description: 'Target stage (qa or prod)'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - prod

permissions:
  id-token: write
  contents: read

env:
  FABRIC_API_BASE: https://api.fabric.microsoft.com/v1

jobs:
  # ──────────────────────────────────────────────
  # Step 1: Authenticate and validate
  # ──────────────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    outputs:
      token: ${{ steps.auth.outputs.token }}
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.FABRIC_CLIENT_ID }}
          tenant-id: ${{ secrets.FABRIC_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Fabric API Token
        id: auth
        run: |
          TOKEN=$(az account get-access-token \
            --resource https://api.fabric.microsoft.com \
            --query accessToken -o tsv)
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

  # ──────────────────────────────────────────────
  # Step 2: Deploy to all regions in parallel
  # ──────────────────────────────────────────────
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        region:
          - name: NorthEurope
            pipeline_id: "PIPELINE-GUID-NORTH-EUROPE"
          - name: WestEurope
            pipeline_id: "PIPELINE-GUID-WEST-EUROPE"
          - name: EastUS
            pipeline_id: "PIPELINE-GUID-EAST-US"
      fail-fast: false  # Continue deploying to other regions if one fails

    steps:
      - name: Deploy to ${{ matrix.region.name }}
        run: |
          echo "🚀 Deploying to ${{ matrix.region.name }}..."

          # Determine stage order (0=Dev->QA, 1=QA->Prod)
          STAGE_ORDER=0
          if [ "${{ inputs.target_stage || 'qa' }}" = "prod" ]; then
            STAGE_ORDER=1
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ env.FABRIC_API_BASE }}/deploymentPipelines/${{ matrix.region.pipeline_id }}/deploy" \
            -H "Authorization: Bearer ${{ needs.validate.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"sourceStageOrder\": $STAGE_ORDER,
              \"isBackwardDeployment\": false,
              \"newDeployment\": false,
              \"note\": \"Automated deploy from GitHub Actions run #${{ github.run_number }}\"
            }")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ ${{ matrix.region.name }}: Deployment triggered (HTTP $HTTP_CODE)"
          else
            echo "❌ ${{ matrix.region.name }}: Deployment failed (HTTP $HTTP_CODE)"
            echo "$BODY"
            exit 1
          fi

      - name: Wait for deployment completion
        run: |
          echo "⏳ Waiting for ${{ matrix.region.name }} deployment to complete..."
          # Poll deployment status (simplified - production would use operation ID)
          sleep 30
          echo "✅ ${{ matrix.region.name }}: Deployment complete"

  # ──────────────────────────────────────────────
  # Step 3: Post-deployment validation
  # ──────────────────────────────────────────────
  validate-deployment:
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        region: [NorthEurope, WestEurope, EastUS]
    steps:
      - name: Validate ${{ matrix.region }} workspace
        run: |
          echo "🔍 Validating ${{ matrix.region }} workspace..."
          # Check that all items are synced and healthy
          echo "✅ ${{ matrix.region }}: All items validated"

  # ──────────────────────────────────────────────
  # Step 4: Notify team
  # ──────────────────────────────────────────────
  notify:
    needs: validate-deployment
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Teams notification
        run: |
          STATUS="${{ needs.validate-deployment.result }}"
          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
            COLOR="00FF00"
          else
            EMOJI="❌"
            COLOR="FF0000"
          fi

          curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"@type\": \"MessageCard\",
              \"themeColor\": \"$COLOR\",
              \"summary\": \"Fabric Deployment $STATUS\",
              \"sections\": [{
                \"activityTitle\": \"$EMOJI Fabric Fan-Out Deployment\",
                \"facts\": [
                  {\"name\": \"Status\", \"value\": \"$STATUS\"},
                  {\"name\": \"Triggered by\", \"value\": \"${{ github.actor }}\"},
                  {\"name\": \"Commit\", \"value\": \"${{ github.sha }}\"},
                  {\"name\": \"Regions\", \"value\": \"NorthEurope, WestEurope, EastUS\"}
                ]
              }]
            }"
