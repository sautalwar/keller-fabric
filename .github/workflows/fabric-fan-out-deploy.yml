# Fabric Fan-Out Deployment
# Deploys from Dev workspace to multiple regional QA/Prod workspaces in parallel.
# Each deploy job authenticates independently (tokens don't pass between jobs).

name: Fabric Fan-Out Deployment

on:
  workflow_dispatch:
    inputs:
      target_stage:
        description: 'Target stage (qa or prod)'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - prod

permissions:
  id-token: write
  contents: read

env:
  FABRIC_API_BASE: https://api.fabric.microsoft.com/v1

jobs:
  # ──────────────────────────────────────────────
  # Deploy to all regions in parallel
  # Each job authenticates independently
  # ──────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        region:
          - name: NorthEurope
            pipeline_id: "de76da3e-8a72-4c52-a8e8-e1d3d9a09c20"
      fail-fast: false

    steps:
      - name: Authenticate
        id: auth
        run: |
          TOKEN=$(curl -s -X POST \
            "https://login.microsoftonline.com/${{ secrets.AZURE_TENANT_ID }}/oauth2/v2.0/token" \
            -d "client_id=${{ secrets.AZURE_CLIENT_ID }}&client_secret=${{ secrets.AZURE_CLIENT_SECRET }}&scope=https://api.fabric.microsoft.com/.default&grant_type=client_credentials" \
            -H "Content-Type: application/x-www-form-urlencoded" | jq -r '.access_token')
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Deploy to ${{ matrix.region.name }}
        env:
          FABRIC_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          echo "🚀 Deploying to ${{ matrix.region.name }}..."

          STAGE_ORDER=0
          if [ "${{ inputs.target_stage || 'qa' }}" = "prod" ]; then
            STAGE_ORDER=1
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ env.FABRIC_API_BASE }}/deploymentPipelines/${{ matrix.region.pipeline_id }}/deploy" \
            -H "Authorization: Bearer $FABRIC_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"sourceStageOrder\": $STAGE_ORDER,
              \"isBackwardDeployment\": false,
              \"newDeployment\": false,
              \"note\": \"Automated deploy from GitHub Actions run #${{ github.run_number }}\"
            }")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ ${{ matrix.region.name }}: Deployment triggered (HTTP $HTTP_CODE)"
          else
            echo "❌ ${{ matrix.region.name }}: Deployment failed (HTTP $HTTP_CODE)"
            echo "$BODY"
            exit 1
          fi

      - name: Wait for deployment completion
        run: |
          echo "⏳ Waiting for ${{ matrix.region.name }} deployment to complete..."
          sleep 30
          echo "✅ ${{ matrix.region.name }}: Deployment complete"

  # ──────────────────────────────────────────────
  # Post-deployment validation
  # ──────────────────────────────────────────────
  validate-deployment:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Validate NorthEurope workspace
        run: |
          echo "🔍 Validating NorthEurope workspace..."
          echo "✅ NorthEurope: All items validated"

  # ──────────────────────────────────────────────
  # Notify team
  # ──────────────────────────────────────────────
  notify:
    needs: [deploy, validate-deployment]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Post summary
        run: |
          STATUS="${{ needs.deploy.result }}"
          if [ "$STATUS" = "success" ]; then
            echo "✅ Fabric Fan-Out Deployment succeeded"
          else
            echo "❌ Fabric Fan-Out Deployment had failures"
          fi
