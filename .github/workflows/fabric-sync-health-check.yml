# Fabric Sync Health Check
# Runs on schedule to monitor Git sync status across all workspaces.
# Alerts via Teams webhook if any items are stuck.
# Generated by GitHub Copilot Agent Mode

name: Fabric Sync Health Check

on:
  schedule:
    - cron: '0 */2 * * *'  # Every 2 hours
  workflow_dispatch:        # Manual trigger for testing

permissions:
  id-token: write
  contents: read

env:
  FABRIC_API_BASE: https://api.fabric.microsoft.com/v1

jobs:
  health-check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        workspace:
          - name: "KLR-RO-NorthEurope-Dev-PowerBI-SM-WS"
            id: "DEV-SM-WORKSPACE-GUID"
          - name: "KLR-RO-NorthEurope-Dev-PowerBI-Reports-WS"
            id: "DEV-REPORTS-WORKSPACE-GUID"
          - name: "KLR-RO-NorthEurope-QA-PowerBI-SM-WS"
            id: "QA-SM-WORKSPACE-GUID"
          - name: "KLR-RO-NorthEurope-Prod-PowerBI-SM-WS"
            id: "PROD-SM-WORKSPACE-GUID"
      fail-fast: false

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.FABRIC_CLIENT_ID }}
          tenant-id: ${{ secrets.FABRIC_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Fabric API Token
        id: auth
        run: |
          TOKEN=$(az account get-access-token \
            --resource https://api.fabric.microsoft.com \
            --query accessToken -o tsv)
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Check sync status for ${{ matrix.workspace.name }}
        id: check
        run: |
          echo "🔍 Checking: ${{ matrix.workspace.name }}"

          # Check Git connection
          CONN=$(curl -s \
            "${{ env.FABRIC_API_BASE }}/workspaces/${{ matrix.workspace.id }}/git/connection" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}")

          GIT_STATUS=$(echo "$CONN" | jq -r '.gitConnectionState // "unknown"')
          echo "Git connection: $GIT_STATUS"

          # Check sync status
          STATUS=$(curl -s \
            "${{ env.FABRIC_API_BASE }}/workspaces/${{ matrix.workspace.id }}/git/status" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}")

          REMOTE_HASH=$(echo "$STATUS" | jq -r '.remoteCommitHash // "unknown"')
          WS_HEAD=$(echo "$STATUS" | jq -r '.workspaceHead // "unknown"')
          CHANGES=$(echo "$STATUS" | jq -r '.changes // [] | length')
          CONFLICTS=$(echo "$STATUS" | jq -r '[.changes[]? | select(.conflictType != null and .conflictType != "None")] | length')

          echo "remote_hash=$REMOTE_HASH" >> $GITHUB_OUTPUT
          echo "ws_head=$WS_HEAD" >> $GITHUB_OUTPUT
          echo "changes=$CHANGES" >> $GITHUB_OUTPUT
          echo "conflicts=$CONFLICTS" >> $GITHUB_OUTPUT

          IN_SYNC="true"
          if [ "$REMOTE_HASH" != "$WS_HEAD" ]; then
            IN_SYNC="false"
          fi
          echo "in_sync=$IN_SYNC" >> $GITHUB_OUTPUT

          # Determine health
          if [ "$CONFLICTS" -gt 0 ]; then
            echo "health=critical" >> $GITHUB_OUTPUT
            echo "❌ CRITICAL: $CONFLICTS conflicts detected"
          elif [ "$IN_SYNC" = "false" ]; then
            echo "health=warning" >> $GITHUB_OUTPUT
            echo "⚠️ WARNING: Workspace out of sync ($CHANGES pending changes)"
          else
            echo "health=healthy" >> $GITHUB_OUTPUT
            echo "✅ HEALTHY: Workspace in sync"
          fi

      - name: Alert on issues
        if: steps.check.outputs.health != 'healthy'
        run: |
          HEALTH="${{ steps.check.outputs.health }}"
          WS_NAME="${{ matrix.workspace.name }}"
          CHANGES="${{ steps.check.outputs.changes }}"
          CONFLICTS="${{ steps.check.outputs.conflicts }}"

          if [ "$HEALTH" = "critical" ]; then
            EMOJI="🔴"
            COLOR="FF0000"
            TITLE="CRITICAL: Git Sync Conflicts Detected"
          else
            EMOJI="🟡"
            COLOR="FFB900"
            TITLE="WARNING: Workspace Out of Sync"
          fi

          curl -s -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"@type\": \"MessageCard\",
              \"themeColor\": \"$COLOR\",
              \"summary\": \"$TITLE\",
              \"sections\": [{
                \"activityTitle\": \"$EMOJI $TITLE\",
                \"facts\": [
                  {\"name\": \"Workspace\", \"value\": \"$WS_NAME\"},
                  {\"name\": \"Pending Changes\", \"value\": \"$CHANGES\"},
                  {\"name\": \"Conflicts\", \"value\": \"$CONFLICTS\"},
                  {\"name\": \"Action Required\", \"value\": \"Check Fabric portal or run Force-SyncFromGit.ps1\"}
                ]
              }]
            }"
