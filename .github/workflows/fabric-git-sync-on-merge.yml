# Fabric Git Sync on PR Merge
# Automatically syncs the Fabric workspace from Git when a PR is merged to main.
# Generated by GitHub Copilot Agent Mode

name: Fabric Git Sync on Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  FABRIC_API_BASE: https://api.fabric.microsoft.com/v1
  # Map of workspace names to IDs (update with your actual workspace GUIDs)
  WORKSPACE_ID: "YOUR-WORKSPACE-GUID-HERE"

jobs:
  sync-workspace:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.FABRIC_CLIENT_ID }}
          tenant-id: ${{ secrets.FABRIC_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Fabric API Token
        id: auth
        run: |
          TOKEN=$(az account get-access-token \
            --resource https://api.fabric.microsoft.com \
            --query accessToken -o tsv)
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Check Git sync status
        id: status
        run: |
          echo "📊 Checking workspace Git sync status..."
          RESPONSE=$(curl -s \
            "${{ env.FABRIC_API_BASE }}/workspaces/${{ env.WORKSPACE_ID }}/git/status" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}")

          REMOTE_HASH=$(echo "$RESPONSE" | jq -r '.remoteCommitHash')
          WORKSPACE_HEAD=$(echo "$RESPONSE" | jq -r '.workspaceHead')
          CHANGES=$(echo "$RESPONSE" | jq -r '.changes | length')

          echo "remote_hash=$REMOTE_HASH" >> $GITHUB_OUTPUT
          echo "workspace_head=$WORKSPACE_HEAD" >> $GITHUB_OUTPUT

          echo "Remote commit: $REMOTE_HASH"
          echo "Workspace head: $WORKSPACE_HEAD"
          echo "Pending changes: $CHANGES"

          if [ "$REMOTE_HASH" = "$WORKSPACE_HEAD" ]; then
            echo "✅ Workspace is already in sync"
            echo "needs_sync=false" >> $GITHUB_OUTPUT
          else
            echo "🔄 Workspace needs sync"
            echo "needs_sync=true" >> $GITHUB_OUTPUT
          fi

      - name: Sync workspace from Git
        if: steps.status.outputs.needs_sync == 'true'
        run: |
          echo "🔄 Syncing workspace from Git..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ env.FABRIC_API_BASE }}/workspaces/${{ env.WORKSPACE_ID }}/git/updateFromGit" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"remoteCommitHash\": \"${{ steps.status.outputs.remote_hash }}\",
              \"conflictResolution\": {
                \"conflictResolutionType\": \"Workspace\"
              },
              \"options\": {
                \"allowOverrideItems\": true
              }
            }")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Workspace synced successfully"
          else
            echo "❌ Sync failed (HTTP $HTTP_CODE)"
            echo "$BODY"
            exit 1
          fi

      - name: Verify sync completion
        if: steps.status.outputs.needs_sync == 'true'
        run: |
          echo "🔍 Verifying sync..."
          sleep 10  # Allow time for async operations

          RESPONSE=$(curl -s \
            "${{ env.FABRIC_API_BASE }}/workspaces/${{ env.WORKSPACE_ID }}/git/status" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}")

          NEW_HEAD=$(echo "$RESPONSE" | jq -r '.workspaceHead')
          REMOTE=$(echo "$RESPONSE" | jq -r '.remoteCommitHash')

          if [ "$NEW_HEAD" = "$REMOTE" ]; then
            echo "✅ Sync verified: workspace matches Git"
          else
            echo "⚠️ Sync may still be in progress"
            echo "Workspace head: $NEW_HEAD"
            echo "Remote commit: $REMOTE"
          fi

      - name: Post PR comment with sync status
        uses: actions/github-script@v7
        with:
          script: |
            const needsSync = '${{ steps.status.outputs.needs_sync }}';
            const body = needsSync === 'true'
              ? '✅ **Fabric Workspace Synced** — Workspace has been updated to match this merge.'
              : '✅ **Fabric Workspace** — Already in sync, no update needed.';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
